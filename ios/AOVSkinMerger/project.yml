name: AOVSkinMerger
options:
  bundleIdPrefix: com.aki
  deploymentTarget:
    iOS: "26.5"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20
  zstd:
    url: https://github.com/meta/zstd.git
    revision: a599a71c4cf5d142ffce772c0d16a5a7b755d83c
targets:
  AOVSkinMerger:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: ZIPFoundation
      - package: zstd
        product: libzstd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aki.aovskinmerger
        INFOPLIST_KEY_CFBundleDisplayName: AKI AOV SKIN
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "17"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.5"
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - AOVSkinMergerTests
      gatherCoverageData: true
    info:
      path: Info.plist
      properties:
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: ZIP Archive
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.zip-archive
  AOVSkinMergerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: AOVSkinMerger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aki.aovskinmerger.tests
        GENERATE_INFOPLIST_FILE: YES
