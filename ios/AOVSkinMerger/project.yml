name: AOVSkinMerger
options:
  bundleIdPrefix: com.aki
  deploymentTarget:
    iOS: "16.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20
  zstd:
    url: https://github.com/meta/zstd.git
    revision: a599a71c4cf5d142ffce772c0d16a5a7b755d83c
targets:
  AOVSkinMerger:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources/AoVZstdDictionary.base64
    dependencies:
      - package: ZIPFoundation
      - package: zstd
        product: libzstd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aki.aovskinmerger
        INFOPLIST_KEY_CFBundleDisplayName: AKI AOV SKIN
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1"
  AOVSkinMergerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    resources:
      - path: Resources/AoVZstdDictionary.base64
    dependencies:
      - target: AOVSkinMerger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aki.aovskinmerger.tests
        GENERATE_INFOPLIST_FILE: YES
