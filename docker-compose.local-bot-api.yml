name: aki-aov-tools

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in .env}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    expose:
      - "8081"

  bot:
    build: .
    command: ["python", "bot.py"]
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      TELEGRAM_API_BASE_URL: http://telegram-bot-api:8081/bot
      TELEGRAM_FILE_BASE_URL: http://telegram-bot-api:8081/file/bot
    depends_on:
      - telegram-bot-api

  web:
    build: .
    command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    restart: unless-stopped
    ports:
      - "8000:8000"

volumes:
  telegram-bot-api-data:
