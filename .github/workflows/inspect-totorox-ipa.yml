name: Inspect reference Totorox IPA

on:
  push:
    branches:
      - feat/ios-offline-app-prototype
    paths:
      - '.github/workflows/inspect-totorox-ipa.yml'

permissions:
  contents: read

jobs:
  inspect-reference-ipa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact reference commit
        uses: actions/checkout@v4
        with:
          ref: 47b4f4abf14249e21cd14bb4dabf38a7ee94b31f

      - name: Verify reference IPA archive
        run: |
          set -euo pipefail
          test -s Totorox-2.0.ipa
          echo "File size:"
          stat -c '%s bytes' Totorox-2.0.ipa
          echo "SHA-256:"
          sha256sum Totorox-2.0.ipa
          echo "Archive listing:"
          unzip -Z1 Totorox-2.0.ipa | head -80
          unzip -tq Totorox-2.0.ipa

      - name: Upload exact IPA for inspection
        uses: actions/upload-artifact@v4
        with:
          name: totorox-2.0-ipa-inspection
          path: Totorox-2.0.ipa
          if-no-files-found: error
          retention-days: 2
