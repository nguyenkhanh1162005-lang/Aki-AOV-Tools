name: Collect AOV ZIPs from Release

on:
  release:
    types: [published]

permissions:
  contents: read
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p incoming
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir incoming

      - name: Validate ZIPs and calculate SHA-256
        shell: bash
        run: |
          shopt -s nullglob nocaseglob
          files=(incoming/*.zip)
          if (( ${#files[@]} == 0 )); then
            echo "No .zip assets found in this release." >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Checking: $file"
            unzip -tqq "$file"
          done
          sha256sum "${files[@]}" | tee SHA256SUMS.txt
          printf '\nValidated %s ZIP file(s).\n' "${#files[@]}"

      - name: Upload verified ZIPs as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: aov-zips-${{ github.event.release.tag_name }}
          path: |
            incoming/*.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
