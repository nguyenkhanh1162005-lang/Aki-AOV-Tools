name: AOV source-pair integration

on:
  push:
    branches: ["feature/universal-mod-adapter-registry"]
    paths:
      - "app/ifix_merger.py"
      - "app/aov_merger.py"
      - "tools/ifix_parse.py"
      - "tools/run_aov_integration.py"
      - ".github/workflows/aov-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge-pinned-source-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install merger dependencies
        run: python -m pip install -r requirements.txt

      - name: Download pinned user-supplied MOD archives
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/nguyenkhanh1162005-lang/Aki-AOV-Tools/releases/download/aov-upload-01/Mod.VN.100.Skin.Ver.12.-.iOS.KHAM.PHA.MOBILE.zip" \
            --output /tmp/kpm100-ios.zip
          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/nguyenkhanh1162005-lang/Aki-AOV-Tools/releases/download/aov-upload-01/VTK.IOS.VIP.zip" \
            --output /tmp/vtk-ios.zip
          echo "944d01f6a4e31dbaa7ea31c14d292b799818843a4e3533860b2e16ff4bb77aa0  /tmp/kpm100-ios.zip" | sha256sum --check
          echo "b78976a7d9c0d7ce2420fdd631cdf47136bc9b0f313fbfcbbb6cb9af3a582249  /tmp/vtk-ios.zip" | sha256sum --check

      - name: Run real IFix and full archive merge
        run: |
          python tools/run_aov_integration.py \
            /tmp/kpm100-ios.zip \
            /tmp/vtk-ios.zip \
            /tmp/Aki-AOV-KPM100-VTK-integration.zip

      - name: Upload tested candidate archive
        uses: actions/upload-artifact@v4
        with:
          name: aov-real-source-pair-integration-candidate
          path: /tmp/Aki-AOV-KPM100-VTK-integration.zip
          if-no-files-found: error
          retention-days: 3
