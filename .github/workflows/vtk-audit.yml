name: One-time VTK archive audit

on:
  push:
    branches: ["feature/google-drive-import"]

jobs:
  audit-vtk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Download and inspect the shared 141 MB VTK archive
        run: python tools/inspect_vtk_drive.py
      - uses: actions/upload-artifact@v4
        with:
          name: vtk-archive-audit
          path: vtk-audit.json
