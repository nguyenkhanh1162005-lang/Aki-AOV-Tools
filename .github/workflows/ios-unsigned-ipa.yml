name: Build iOS unsigned IPA

on:
  # Build a fresh unsigned IPA whenever the iOS prototype branch changes.
  push:
    branches:
      - feat/ios-offline-app-prototype
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aki-aov-skin-ios-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-unsigned-ipa:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select Xcode 26.6 and verify iOS 26.5 SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcodebuild -showsdks | grep -F "iOS 26.5"

      - name: Generate 1024px app icon from supplied artwork
        shell: bash
        run: |
          set -euo pipefail
          ICON_DIR="ios/AOVSkinMerger/Sources/Assets.xcassets/AppIcon.appiconset"
          export ICON_OUTPUT="$RUNNER_TEMP/aki-aov-skin-icon.jpg"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          source = Path("ios/AOVSkinMerger/IconSource/app-icon.jpg.base64").read_text().strip()
          Path(os.environ["ICON_OUTPUT"]).write_bytes(base64.b64decode(source, validate=True))
          PY
          sips -s format png -z 1024 1024 "$ICON_OUTPUT" --out "$ICON_DIR/AppIcon.png"
          test -s "$ICON_DIR/AppIcon.png"

          # Install the user-supplied AKI hero artwork into the asset catalog.
          HERO_DIR="ios/AOVSkinMerger/Sources/Assets.xcassets/AkiHero.imageset"
          mkdir -p "$HERO_DIR"
          python3 - <<'PY'
          import base64
          from pathlib import Path
          source = Path("ios/AOVSkinMerger/Artwork/AkiHero.jpg.base64").read_text().strip()
          output = Path("ios/AOVSkinMerger/Sources/Assets.xcassets/AkiHero.imageset/AkiHero.jpg")
          output.write_bytes(base64.b64decode(source, validate=True))
          PY
          test -s "$HERO_DIR/AkiHero.jpg"
          file "$HERO_DIR/AkiHero.jpg"

      - name: Generate Xcode project
        working-directory: ios/AOVSkinMerger
        run: xcodegen generate

      - name: Resolve Swift packages
        working-directory: ios/AOVSkinMerger
        run: >-
          xcodebuild -resolvePackageDependencies
          -project AOVSkinMerger.xcodeproj
          -scheme AOVSkinMerger

      - name: Verify iOS Simulator SDK
        run: |
          xcodebuild -showsdks | grep -F "Simulator - iOS 26.5"

      - name: Compile iOS Simulator test bundle
        working-directory: ios/AOVSkinMerger
        run: >-
          xcodebuild build-for-testing
          -project AOVSkinMerger.xcodeproj
          -scheme AOVSkinMerger
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/AOVTestDerivedData"
          CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned iOS device app
        working-directory: ios/AOVSkinMerger
        run: >-
          xcodebuild
          -project AOVSkinMerger.xcodeproj
          -scheme AOVSkinMerger
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/AOVDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/AOVDerivedData/Build/Products/Release-iphoneos/AOVSkinMerger.app"
          test -d "$APP_PATH"
          PACKAGE_DIR="$RUNNER_TEMP/AOVIPAPackage"
          mkdir -p "$PACKAGE_DIR/Payload"
          ditto "$APP_PATH" "$PACKAGE_DIR/Payload/AOVSkinMerger.app"
          (
            cd "$PACKAGE_DIR"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/AKI AOV SKIN.ipa" Payload
          )
          IPA_PATH="$GITHUB_WORKSPACE/AKI AOV SKIN.ipa"
          test -s "$IPA_PATH"
          /usr/bin/unzip -tq "$IPA_PATH"
          test -d "$PACKAGE_DIR/Payload/AOVSkinMerger.app"
          APP_INFO="$PACKAGE_DIR/Payload/AOVSkinMerger.app/Info.plist"
          test -s "$APP_INFO"
          test -x "$APP_PATH/AOVSkinMerger"
          test "$(plutil -extract CFBundleIdentifier raw "$APP_INFO")" = "com.aki.aovskinmerger"
          test "$(plutil -extract CFBundleShortVersionString raw "$APP_INFO")" = "0.5.3"
          test "$(plutil -extract MinimumOSVersion raw "$APP_INFO")" = "26.5"
          lipo -archs "$APP_PATH/AOVSkinMerger" | grep -qw arm64
          shasum -a 256 "$IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AKI-AOV-SKIN-0.5.3-iOS-26.5-IPA
          path: AKI AOV SKIN.ipa
          if-no-files-found: error
          retention-days: 14
