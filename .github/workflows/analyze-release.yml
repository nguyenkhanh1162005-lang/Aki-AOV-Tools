name: Analyze AOV Release Archives

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download release ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p incoming
          gh release download aov-upload-01 --repo "$GITHUB_REPOSITORY" --dir incoming
      - name: Install Unity asset parser
        run: python -m pip install --disable-pip-version-check UnityPy
      - name: Inspect ZIP structure and target assets
        run: python tools/deep_inspect_aov.py
      - name: Inspect UnityFS headers by engine version
        run: python tools/inspect_unityfs_headers.py | tee -a aov-deep-inspection.txt
      - name: Publish text report on a separate branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan deep-inspect-report-20261111
          git rm -rf . >/dev/null 2>&1 || true
          git add aov-deep-inspection.txt
          git commit -m "Publish AOV deep inspection report"
          git push --force origin HEAD:deep-inspect-report-20261111
      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: aov-deep-inspection
          path: aov-deep-inspection.txt
          retention-days: 7
