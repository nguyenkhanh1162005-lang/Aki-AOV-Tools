name: Build KPM100 plus VTK Lixin iOS ZIP

on:
  push:
    branches: [experiment/kpm100-vtk-diagnostic]

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download original release archives
        run: |
          mkdir -p incoming dist
          curl -fL --retry 3 --retry-delay 2 'https://github.com/nguyenkhanh1162005-lang/Aki-AOV-Tools/releases/download/aov-upload-01/Mod.VN.100.Skin.Ver.12.-.iOS.KHAM.PHA.MOBILE.zip' -o 'incoming/Mod.VN.100.Skin.Ver.12.-.iOS.KHAM.PHA.MOBILE.zip'
          curl -fL --retry 3 --retry-delay 2 'https://github.com/nguyenkhanh1162005-lang/Aki-AOV-Tools/releases/download/aov-upload-01/VTK.IOS.VIP.zip' -o 'incoming/VTK.IOS.VIP.zip'
      - name: Verify immutable source SHA-256
        run: |
          echo '944d01f6a4e31dbaa7ea31c14d292b799818843a4e3533860b2e16ff4bb77aa0  incoming/Mod.VN.100.Skin.Ver.12.-.iOS.KHAM.PHA.MOBILE.zip' | sha256sum -c -
          echo 'b78976a7d9c0d7ce2420fdd631cdf47136bc9b0f313fbfcbbb6cb9af3a582249  incoming/VTK.IOS.VIP.zip' | sha256sum -c -
      - name: Install merger dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt brotli lz4 zstandard
      - name: Build and validate candidate ZIP
        run: |
          set -o pipefail
          python tools/merge_kpm100_vtk.py \
            --base 'incoming/Mod.VN.100.Skin.Ver.12.-.iOS.KHAM.PHA.MOBILE.zip' \
            --vtk 'incoming/VTK.IOS.VIP.zip' \
            --output 'dist/AOV_KPM100_plus_VTK_LiXin_iOS_candidate.zip' \
            --report 'dist/merge-report.json' | tee dist/build-summary.json
      - name: Upload merged ZIP and validation report
        uses: actions/upload-artifact@v4
        with:
          name: merged-kpm100-vtk-lixin-ios
          path: |
            dist/AOV_KPM100_plus_VTK_LiXin_iOS_candidate.zip
            dist/merge-report.json
            dist/build-summary.json
          retention-days: 7
