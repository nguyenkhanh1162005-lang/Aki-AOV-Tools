name: Inspect Liên Quân Resources archive

on:
  push:
    branches:
      - feat/ios-offline-app-prototype
    paths:
      - .github/workflows/inspect-lienquan-resources.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download shared Dropbox archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --retry-delay 2 \
            'https://www.dropbox.com/scl/fi/53mjcq8rr4m2mz5mp8pq8/Li-n-qu-n-g-c.zip?rlkey=6wwijc3k6j7yejfnuz2ce7htz&dl=1' \
            --output Resources.zip
          ls -lh Resources.zip
      - name: Validate archive and inspect structure
        shell: bash
        run: |
          python - <<'PY'
          import zipfile, collections, os
          p = "Resources.zip"
          print("SIZE_BYTES", os.path.getsize(p))
          with zipfile.ZipFile(p) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit("CRC_ERROR: " + bad)
              infos = [i for i in z.infolist() if not i.is_dir()]
              print("ZIP_CRC", "PASS")
              print("FILE_COUNT", len(infos))
              print("UNCOMPRESSED_BYTES", sum(i.file_size for i in infos))
              print("TOP_LEVEL", sorted({i.filename.split("/", 1)[0] for i in infos})[:120])
              print("IMPORTANT_PATHS")
              needles = ("resources/", "assetbundle", "packer", "verification", "assetref", "commonactions", "mses", "ifIix", "wwise", ".bnk", ".wem")
              for i in infos:
                  n = i.filename.lower()
                  if any(s.lower() in n for s in needles):
                      print(i.filename, i.file_size)
              print("EXTENSIONS", collections.Counter(os.path.splitext(i.filename)[1].lower() for i in infos).most_common(35))
          PY
      - name: Preserve original archive as inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: lien-quan-goc-inspection
          path: Resources.zip
          compression-level: 0
          retention-days: 1
