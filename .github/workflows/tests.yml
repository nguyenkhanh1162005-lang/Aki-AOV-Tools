name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app bot.py
      - name: Export temporary AoV decoder fixture
        run: python -c "from app.aov_zstd_dict import ZSTD_DICT; open('aov-zstd-dict.bin', 'wb').write(ZSTD_DICT)"
      - uses: actions/upload-artifact@v4
        with:
          name: aov-zstd-dict
          path: aov-zstd-dict.bin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Prepare temporary UnityPy wheels for local metadata inspection
        run: python -m pip download UnityPy -d /tmp/unitypy-wheels
      - uses: actions/upload-artifact@v4
        with:
          name: unitypy-wheels
          path: /tmp/unitypy-wheels/
      - name: Fetch AOV UnityPy fork for metadata inspection
        run: |
          git clone --depth 1 https://github.com/Alanshown/AOV_UABE_2022.git /tmp/AOV_UABE_2022
          mkdir -p /tmp/aov-unitypy/AssetbundleUtils
          cp -r /tmp/AOV_UABE_2022/AssetbundleUtils/UnityPy_AOV /tmp/aov-unitypy/AssetbundleUtils/
          cp /tmp/AOV_UABE_2022/AssetbundleUtils/AssetBundleMetadata.py /tmp/aov-unitypy/AssetbundleUtils/
      - uses: actions/upload-artifact@v4
        with:
          name: aov-unitypy-source
          path: /tmp/aov-unitypy/
      - name: Download wheels for local AoV binary inspection
        run: python -m pip download pyzstd pycryptodome -d /tmp/aov-wheels
      - uses: actions/upload-artifact@v4
        with:
          name: aov-runtime-wheels
          path: /tmp/aov-wheels/
